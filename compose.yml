services:
  backend:
    profiles: [ "backend", "full" ]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: wetterdienst-backend:dev
    container_name: wetterdienst-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Common development env overrides; can be overridden in .env
      - PYTHONUNBUFFERED=1
    ports:
      - "3000:3000"
    develop:
      watch:
        - path: src/wetterdienst
          action: sync
          target: /app/src/wetterdienst
        - path: ./pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild

  app:
    profiles: [ "app", "full" ]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: dev
    image: wetterdienst-app:dev
    container_name: wetterdienst-app
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=4000
      - CI=true
      - NUXT_PUBLIC_API_BASE=http://backend:3000/api
    ports:
      - "4000:4000"
    develop:
      watch:
        - path: app/package.json
          action: rebuild
        - path: app/pnpm-lock.yaml
          action: rebuild
        - path: app/
          action: sync
          target: /app
          ignore:
            - app/node_modules
            - app/.nuxt
            - app/.output
