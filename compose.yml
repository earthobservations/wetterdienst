services:
  backend:
    profiles: [ "backend", "full" ]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: wetterdienst-backend:dev
    container_name: wetterdienst-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Common development env overrides; can be overridden in .env
      - PYTHONUNBUFFERED=1
    ports:
      # on this machine only; WETTERDIENST_BIND_HOST=0.0.0.0 (shell or .env) opens it to the network
      - "${WETTERDIENST_BIND_HOST:-127.0.0.1}:7890:7890"
    develop:
      watch:
        - path: src/wetterdienst
          action: sync
          target: /app/src/wetterdienst
        - path: ./pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild

  app:
    profiles: [ "app", "full" ]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: dev
    image: wetterdienst-app:dev
    container_name: wetterdienst-app
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=4000
      - CI=true
      - NUXT_PUBLIC_API_BASE=http://backend:7890/api
    ports:
      # a dev server with Nuxt DevTools: on this machine only, see the backend
      - "${WETTERDIENST_BIND_HOST:-127.0.0.1}:4000:4000"
    develop:
      watch:
        - path: app/package.json
          action: rebuild
        - path: app/pnpm-lock.yaml
          action: rebuild
        - path: app/
          action: sync
          target: /app
          ignore:
            - app/node_modules
            - app/.nuxt
            - app/.output
