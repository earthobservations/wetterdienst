dangerouslyAllowAllBuilds: true
confirmModulesPurge: false
# Supply-chain cooldown: refuse versions published less than three days ago, so a
# compromised release has time to be caught and pulled before it reaches us. 4320
# minutes matches the cooldown Dependabot already applies by default to the uv,
# docker and github-actions ecosystems in .github/dependabot.yml, so both halves of
# the repo wait the same length of time. pnpm 11's own default is a shorter 1440.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@nuxt/kit@3.21.10'
  - '@nuxt/test-utils@4.1.0'
  - esbuild@0.28.1
  - brace-expansion@5.0.8
shellEmulator: true
trustPolicy: no-downgrade
overrides:
  # Security overrides: force patched versions of two transitive deps that intermediate
  # packages pin below the fix -- brace-expansion (ReDoS) and esbuild (dev-server file
  # read, GHSA-g7r4-m6w7-qqqr). `pnpm update` cannot move them because their parents pin
  # the vulnerable range; the scoped ranges below leave other major lines untouched.
  brace-expansion@>=4.0.0 <5.0.8: ^5.0.8
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  # Without this, pnpm's trustPolicy: no-downgrade rejects semver@6.3.1 (a
  # long-standing transitive dep of @babel/core@7.x, pulled in via
  # nuxt-security -> unplugin-remove) because that specific release lacks
  # provenance attestation that an earlier semver version had. Not a known
  # vulnerability -- babel 7.x has depended on semver ^6.3.1 for years, and
  # babel 8 (which finally moved to semver ^7.x) is too fresh for
  # unplugin-remove to have picked up yet. Revisit once it does.
  semver: ^7.8.2
  # Same trustPolicy issue for undici-types@6.21.0, pulled in via
  # @duckdb/duckdb-wasm -> apache-arrow -> @types/node@20.19.42 (an older,
  # separately-resolved @types/node than the workspace's own ^25.x).
  undici-types: ^6.21.0
