# Supply-chain cooldown: refuse versions published less than three days ago, so a
# compromised release has time to be caught and pulled before it reaches us. 4320
# minutes is three days. Dependabot (.github/dependabot.yml) waits seven days before it
# proposes a version, so this is the floor for an update made by hand (`pnpm update`), and
# a shorter wait than Dependabot's. pnpm 11's own default is a shorter 1440.
minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true
confirmModulesPurge: false

minimumReleaseAgeExclude:
  - '@nuxt/kit@3.21.10'
  - '@nuxt/test-utils@4.1.0'
  - esbuild@0.28.1

trustPolicy: no-downgrade
shellEmulator: true

overrides:
  # Security overrides: floors at the patched versions of two transitive deps whose
  # parents' ranges admit vulnerable versions -- brace-expansion 4.x-5.x (denial-of-service
  # advisories up to GHSA-q2hr-2g5m-vwhr, all fixed by 5.0.12; minimatch 10 asks for
  # ^5.0.8) and esbuild (dev-server file read, GHSA-g7r4-m6w7-qqqr). The scoped ranges below
  # leave other major lines untouched; brace-expansion's 1.x and 2.x copies are locked at
  # their patched backports (1.1.21, 2.1.7), with no floor.
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  # katex (dev-only, via @antfu/eslint-config -> @eslint/markdown -> micromark-extension-math):
  # fixed in 0.18.2 (0.18.11 is deprecated in favour of 0.19.0), but micromark-extension-math
  # asks for ^0.16.0 and has no newer release. Drop this once it admits the fixed line.
  katex@<0.18.2: ^0.19.0
  # qs (GHSA-6pq8-jhm2-2vcw, fixed in 6.16.1): @duckdb/duckdb-wasm pins qs 6.16.0 exactly and
  # ships no code that loads it (its dist never requires qs), so this only keeps the vulnerable
  # copy out of the lock file. Drop this once duckdb-wasm asks for a fixed qs.
  qs@<6.16.1: ^6.16.1
  # Without this, pnpm's trustPolicy: no-downgrade rejects semver@6.3.1 (a
  # long-standing transitive dep of @babel/core@7.x, pulled in via
  # nuxt-security -> unplugin-remove) because that specific release lacks
  # provenance attestation that an earlier semver version had. Not a known
  # vulnerability -- babel 7.x has depended on semver ^6.3.1 for years, and
  # babel 8 (which finally moved to semver ^7.x) is too fresh for
  # unplugin-remove to have picked up yet. Revisit once it does.
  semver: ^7.8.2
  # serialize-javascript (build tooling, nuxt > nitropack > @rollup/plugin-terser): fixed in
  # 7.1.3; the parent asks for ^7.0.3, which admits the vulnerable 7.1.2 as well.
  serialize-javascript@<7.1.3: ^7.1.3
  # Same trustPolicy issue for undici-types@6.21.0, pulled in via
  # @duckdb/duckdb-wasm -> apache-arrow -> @types/node@20.19.42 (an older,
  # separately-resolved @types/node than the workspace's own ^25.x).
  undici-types: ^6.21.0

# Lifecycle scripts of dependencies: none runs. pnpm 11 blocks them unless a package is named
# here, and fails the install (strictDepBuilds) for one that is named nowhere, so a new
# dependency with an install script is a decision in this file, not a silent execution.
# Each of these only has a fallback behind its script, which the app does not need:
#   @parcel/watcher   builds from source only when npm_config_build_from_source is set; the
#                     prebuilt @parcel/watcher-<platform> package is what the app uses
#   esbuild           links the platform binary over its JS launcher (speed only), or fetches the
#                     binary when the optional package is missing
#   unrs-resolver     fetches the platform's native binding from npm when the optional package
#                     was not installed
#   vue-demi          picks the Vue 2 or Vue 3 build; the copy that ships is already the Vue 3 one
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
