name: App Tests

# Type check, lint and the vitest suite read nothing but the app, so they stay on app/**.
# The E2E suite also drives a backend started from src/ and lives in app-e2e.yml, which
# carries the wider filter.
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/app-tests.yml'

  # Allow job to be triggered manually
  workflow_dispatch:

# Cancel in-progress jobs when pushing to the same branch
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run type check
        run: pnpm run typecheck

  lint:
    name: Lint App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run linter
        run: pnpm run lint

  unit-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run unit and component tests
        run: pnpm run test:ci
