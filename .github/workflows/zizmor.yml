name: Zizmor

# zizmor lints the workflow files and dependabot.yml, with every rule on (no config file). Its own
# paths list therefore covers all of .github/ rather than naming this file.
on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/**'
      - 'pyproject.toml'
      - 'uv.lock'

  # Allow job to be triggered manually.
  workflow_dispatch:

# A push to a pull request cancels the run it supersedes; a run on main is never cancelled once it has started
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  PYTHON: "3.14"

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install project
        run: uv sync

      - name: Run code-style checks
        run: uv run poe zizmor
