name: Zizmor

# zizmor lints the workflow files themselves, configured by the zizmor.yml at the repo
# root. Its own paths list therefore covers all of .github/ rather than naming this file.
on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
      - 'zizmor.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/**'
      - 'zizmor.yml'
      - 'pyproject.toml'
      - 'uv.lock'

  # Allow job to be triggered manually.
  workflow_dispatch:

# Cancel in-progress jobs when pushing to the same branch.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  PYTHON: "3.14"

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Acquire sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install project
        run: uv sync

      - name: Run code-style checks
        run: uv run poe zizmor
