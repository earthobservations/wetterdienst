name: TEMPORARY findlibs 2441

# Temporary evidence for GH-2441, removed again before the pull request is reported. For each set of
# eccodes / eccodeslib / findlibs versions it installs them into one fresh venv that has
# wetterdienst[bufr,radarplus], and prints the exit code of every way of loading eccodes and pyproj.
on:
  push:
    branches: [ fix/bufr-findlibs-floor-2441 ]

permissions: {}

jobs:
  matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-24.04", "ubuntu-24.04-arm", "macos-latest" ]
        python: [ "3.11", "3.14" ]
    defaults:
      run:
        shell: bash
    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Fresh venv with the extras
        run: |
          uname -a
          uv venv --seed --python "${{ matrix.python }}" "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet ".[bufr,radarplus]"
          echo "== as the extras install it"
          "$RUNNER_TEMP/venv/bin/python" -m pip list 2>/dev/null | grep -i -E "^(eccodes|eccodeslib|eckitlib|findlibs|pyproj|wradlib|xradar|pdbufr|wetterdienst) "

      - name: Sets and checks
        run: |
          # a check that aborts is the result, not the end of the script
          set +e +o pipefail
          PY="$RUNNER_TEMP/venv/bin/python"
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"

          check() {
            label="$1"; shift
            out=$("$PY" -c "$1" 2>&1)
            code=$?
            echo "  [exit $code] $label"
            if [ "$code" -ne 0 ]; then echo "$out" | tail -4 | sed 's/^/        /'; fi
          }

          one_set() {
            ecc="$1"; lib="$2"; fl="$3"
            echo
            echo "=================== eccodes==$ecc eccodeslib==$lib findlibs==$fl"
            if [ "$lib" = "none" ]; then
              "$PY" -m pip install --quiet "eccodes==$ecc" "findlibs==$fl" 2>&1 | tail -3
            else
              "$PY" -m pip install --quiet "eccodes==$ecc" "eccodeslib==$lib" "findlibs==$fl" 2>&1 | tail -3
            fi
            "$PY" -m pip list 2>/dev/null | grep -i -E "^(eccodes|eccodeslib|eckitlib|findlibs|pyproj|wradlib|xradar|pdbufr|wetterdienst) " | tr '\n' ';'
            echo
            "$PY" -c "import findlibs; print('  findlibs finds:', findlibs.find('eccodes'))" 2>&1 | tail -1
            check "import eccodes; import pyproj" "import eccodes; import pyproj"
            check "import pyproj; import eccodes" "import pyproj; import eccodes"
            check "import eccodes; codes_get_api_version(); import pyproj" "import eccodes; print(eccodes.eccodes.codes_get_api_version()); import pyproj"
            check "import pdbufr; import pyproj" "import pdbufr; import pyproj"
            check "import eccodes; codes_get_api_version(); import wradlib" "import eccodes; eccodes.eccodes.codes_get_api_version(); import wradlib"
            check "wetterdienst bufr_is_available(); import pyproj" "from wetterdienst.util.eccodes import bufr_is_available; assert bufr_is_available(); import pyproj"
            check "wetterdienst bufr_is_available(); import wradlib" "from wetterdienst.util.eccodes import bufr_is_available; assert bufr_is_available(); import wradlib"
            check "eccodes first, BUFR4 sample packed and read back with pdbufr, then pyproj" "
          import eccodes
          import pdbufr
          sample = eccodes.codes_bufr_new_from_samples('BUFR4')
          eccodes.codes_set_array(sample, 'unexpandedDescriptors', [12101])
          eccodes.codes_set(sample, 'airTemperature', 288.15)
          eccodes.codes_set(sample, 'pack', 1)
          open('sample.bufr', 'wb').write(eccodes.codes_get_message(sample))
          df = pdbufr.read_bufr('sample.bufr', columns=('airTemperature',))
          assert len(df) == 1 and abs(df['airTemperature'].iloc[0] - 288.15) < 1e-6, df
          print('decoded', df['airTemperature'].iloc[0])
          import pyproj
          "
          }

          #        eccodes   eccodeslib   findlibs
          one_set  2.49.0    2.49.0.30    0.1.3
          one_set  2.49.0    2.49.0.30    0.1.4
          one_set  2.49.0    2.49.0.30    0.1.5
          one_set  2.50.0    2.50.0.33    0.1.3
          one_set  2.50.0    2.50.0.33    0.1.4
          one_set  2.50.0    2.50.0.33    0.1.5
          one_set  2.46.0    2.46.0.12    0.1.3
          one_set  2.46.0    2.46.0.12    0.1.5
          one_set  2.43.0    2.46.0.12    0.1.3
          one_set  2.43.0    2.46.0.12    0.1.5
