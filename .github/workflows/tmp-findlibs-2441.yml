name: TEMPORARY findlibs 2441 pyproj use

# Temporary evidence for GH-2441, removed again before the pull request is reported. Loads eccodes
# first in a fresh interpreter per check and then actually uses pyproj (a Transformer, a CRS), and
# lets the interpreter exit normally.
on:
  push:
    branches: [ fix/bufr-findlibs-floor-2441 ]

permissions: {}

jobs:
  matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-24.04", "ubuntu-24.04-arm" ]
        python: [ "3.11", "3.14" ]
    defaults:
      run:
        shell: bash
    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Fresh venv with the extras
        run: |
          uv venv --seed --python "${{ matrix.python }}" "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet ".[bufr,radarplus]"

      - name: Sets and checks
        run: |
          # a check that aborts is the result, not the end of the script
          set +e +o pipefail
          PY="$RUNNER_TEMP/venv/bin/python"

          # what is run after eccodes is loaded: real use of pyproj, a checked result, a normal exit
          USE='
          import pyproj
          t = pyproj.Transformer.from_crs("EPSG:4326", "EPSG:32632", always_xy=True)
          x, y = t.transform(9.0, 48.0)
          print("transform", x, y)
          assert abs(x - 500000.0) < 1e-3 and abs(y - 5316000.0) < 20000, (x, y)
          back = pyproj.Transformer.from_crs("EPSG:32632", "EPSG:4326", always_xy=True).transform(x, y)
          assert abs(back[0] - 9.0) < 1e-6 and abs(back[1] - 48.0) < 1e-6, back
          crs = pyproj.CRS.from_epsg(32632)
          print("crs", crs.name, crs.is_projected)
          assert crs.name == "WGS 84 / UTM zone 32N" and crs.is_projected
          print("pyproj", pyproj.__version__, "proj", pyproj.proj_version_str)
          '

          check() {
            label="$1"; code_text="$2"
            out=$("$PY" -c "$code_text" 2>&1)
            code=$?
            echo "  [exit $code] $label"
            echo "$out" | tail -6 | sed 's/^/        /'
          }

          all_checks() {
            check "import eccodes, then use pyproj" "import eccodes
          $USE"
            check "bufr_is_available(), then use pyproj" "from wetterdienst.util.eccodes import bufr_is_available
          assert bufr_is_available()
          $USE"
            check "BUFR4 sample decoded with pdbufr, then use pyproj" "import eccodes
          import pdbufr
          sample = eccodes.codes_bufr_new_from_samples('BUFR4')
          eccodes.codes_set_array(sample, 'unexpandedDescriptors', [12101])
          eccodes.codes_set(sample, 'airTemperature', 288.15)
          eccodes.codes_set(sample, 'pack', 1)
          open('sample.bufr', 'wb').write(eccodes.codes_get_message(sample))
          df = pdbufr.read_bufr('sample.bufr', columns=('airTemperature',))
          assert len(df) == 1 and abs(df['airTemperature'].iloc[0] - 288.15) < 1e-6, df
          print('decoded', df['airTemperature'].iloc[0])
          $USE"
          }

          one_set() {
            ecc="$1"; lib="$2"; fl="$3"
            echo
            echo "=================== eccodes==$ecc eccodeslib==$lib findlibs==$fl"
            "$PY" -m pip install --quiet "eccodes==$ecc" "eccodeslib==$lib" "findlibs==$fl" 2>&1 | tail -3
            "$PY" -m pip list 2>/dev/null | grep -i -E "^(eccodes|eccodeslib|eckitlib|findlibs|pyproj|pdbufr|wetterdienst) " | tr '\n' ';'
            echo
            "$PY" -c "import findlibs; print('  findlibs finds:', findlibs.find('eccodes'))" 2>&1 | tail -1
            all_checks
          }

          uname -m
          #        eccodes   eccodeslib   findlibs
          one_set  2.49.0    2.49.0.30    0.1.4
          one_set  2.50.0    2.50.0.33    0.1.4
          one_set  2.46.0    2.46.0.12    0.1.4
          one_set  2.46.0    2.50.0.33    0.1.4
          one_set  2.43.0    2.46.0.12    0.1.4
          one_set  2.43.0    2.50.0.33    0.1.4
          one_set  2.50.0    2.50.0.33    0.1.5
          one_set  2.50.0    2.50.0.33    0.1.3
