name: Tests

on:
  pull_request: ~
  push:
    branches: [ main ]

  # Allow job to be triggered manually.
  workflow_dispatch:

# Cancel in-progress jobs when pushing to the same branch.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        include:
          - os: "windows-latest"
            python-version: "3.14"
          - os: "macos-15-intel" # x86_64 (Intel, macOS 15)
            python-version: "3.14"
          - os: "macos-26" # arm64 (Apple Silicon, macOS 26 Tahoe)
            python-version: "3.14"
          - os: "macos-26-intel" # x86_64 (Intel, macOS 26 Tahoe)
            python-version: "3.14"

    continue-on-error: true

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      WD_AUTH__METNO_FROST: ${{ secrets.WD_AUTH__METNO_FROST }}
      WD_AUTH__AEMET: ${{ secrets.WD_AUTH__AEMET }}
      WD_AUTH__KNMI: ${{ secrets.WD_AUTH__KNMI }}
      WD_AUTH__CEDA: ${{ secrets.WD_AUTH__CEDA }}

    defaults:
      run:
        shell: bash

    name: Python ${{ matrix.python-version }} on OS ${{ matrix.os }}
    steps:
      - name: Acquire sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install project
        run: uv sync

      - name: Install eccodes (Ubuntu only)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev

      - name: Install eccodes (Mac only)
        if: ${{ startsWith(matrix.os, 'macos-') }}
        run: |
          brew install eccodes
          export WD_ECCODES_DIR=$(brew --prefix eccodes)

      - name: Install extras for testing
        run: .github/workflows/install.sh testing

      - name: Run tests
        run: |
          uv run poe test

  # Resolve every *direct* dependency to the lowest version its specifier allows and run the
  # suite against that. This is what catches calls to arguments/symbols that only exist in
  # newer releases of our dependencies - something neither the lockfile-based jobs above nor
  # static analysis can detect, because they only ever see the newest version installed.
  minimum-versions:
    name: Minimum dependency versions
    runs-on: ubuntu-latest

    continue-on-error: true

    env:
      UV_RESOLUTION: lowest-direct
      WD_AUTH__METNO_FROST: ${{ secrets.WD_AUTH__METNO_FROST }}
      WD_AUTH__AEMET: ${{ secrets.WD_AUTH__AEMET }}
      WD_AUTH__KNMI: ${{ secrets.WD_AUTH__KNMI }}
      WD_AUTH__CEDA: ${{ secrets.WD_AUTH__CEDA }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Acquire sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # oldest supported Python, where the oldest dependency releases are still available
          python-version: "3.10"

      - name: Install project
        run: uv sync

      - name: Install eccodes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev

      - name: Install extras for testing
        run: .github/workflows/install.sh testing

      - name: Show resolved versions
        run: uv pip list

      - name: Run tests
        run: |
          uv run poe test
