name: Tests

# The matrix is ten jobs of a network-bound suite, so it is worth being precise about what can
# actually change its outcome. Beyond the obvious sources and tests that is the documentation -
# tests/test_docs.py checks the provider pages under docs/data/provider against the metadata model -
# and three root files: the README is doctested and CITATION.cff is tied to it and to the changelog.
# The suite also reaches into the app: tests/test_app_i18n.py reads the translation catalogs under
# app/i18n and the home page, to catch a parameter that gained a name here but not there, and
# tests/metadata/test_resolution.py reads the resolution union in app/shared/types/api.ts, to catch
# a resolution that gained a name here but not there. Those three entries are the whole of the app
# it reads - a test that starts reading more has to widen them.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/data/provider/**'
      - 'app/i18n/**'
      - 'app/app/pages/index.vue'
      - 'app/shared/types/api.ts'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
      - '.github/workflows/install.sh'
      - '.github/workflows/tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/data/provider/**'
      - 'app/i18n/**'
      - 'app/app/pages/index.vue'
      - 'app/shared/types/api.ts'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
      - '.github/workflows/install.sh'
      - '.github/workflows/tests.yml'

  # Allow job to be triggered manually.
  workflow_dispatch:

# Cancel in-progress jobs when pushing to the same branch.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        include:
          - os: "windows-latest"
            python-version: "3.14"
          - os: "macos-15-intel" # x86_64 (Intel, macOS 15)
            python-version: "3.14"
          - os: "macos-26" # arm64 (Apple Silicon, macOS 26 Tahoe)
            python-version: "3.14"
          - os: "macos-26-intel" # x86_64 (Intel, macOS 26 Tahoe)
            python-version: "3.14"

    continue-on-error: true

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      WD_AUTH__METNO_FROST: ${{ secrets.WD_AUTH__METNO_FROST }}
      WD_AUTH__AEMET: ${{ secrets.WD_AUTH__AEMET }}
      WD_AUTH__KNMI: ${{ secrets.WD_AUTH__KNMI }}
      WD_AUTH__CEDA: ${{ secrets.WD_AUTH__CEDA }}

    defaults:
      run:
        shell: bash

    name: Python ${{ matrix.python-version }} on OS ${{ matrix.os }}
    steps:
      - name: Acquire sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install project
        run: uv sync

      - name: Install eccodes (Ubuntu only)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev

      - name: Install eccodes (Mac only)
        if: ${{ startsWith(matrix.os, 'macos-') }}
        run: |
          brew install eccodes
          export WD_ECCODES_DIR=$(brew --prefix eccodes)

      - name: Install extras for testing
        run: .github/workflows/install.sh testing

      - name: Run tests
        run: |
          uv run poe test

  # Resolve every *direct* dependency to the lowest version its specifier allows and run the
  # suite against that. This is what catches calls to arguments/symbols that only exist in
  # newer releases of our dependencies - something neither the lockfile-based jobs above nor
  # static analysis can detect, because they only ever see the newest version installed.
  minimum-versions:
    name: Minimum dependency versions
    runs-on: ubuntu-latest

    continue-on-error: true

    env:
      UV_RESOLUTION: lowest-direct
      WD_AUTH__METNO_FROST: ${{ secrets.WD_AUTH__METNO_FROST }}
      WD_AUTH__AEMET: ${{ secrets.WD_AUTH__AEMET }}
      WD_AUTH__KNMI: ${{ secrets.WD_AUTH__KNMI }}
      WD_AUTH__CEDA: ${{ secrets.WD_AUTH__CEDA }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Acquire sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # oldest supported Python, where the oldest dependency releases are still available
          python-version: "3.10"

      - name: Install project
        run: uv sync

      - name: Install eccodes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev

      - name: Install extras for testing
        run: .github/workflows/install.sh testing

      - name: Show resolved versions
        run: uv pip list

      - name: Run tests
        run: |
          uv run poe test
