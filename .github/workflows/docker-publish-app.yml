name: Release Docker App

on:
  push:
    tags:
      - 'app-v*.*.*'  # App releases only (app-v1.0.0)
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'docker/app.Dockerfile'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - '.github/workflows/docker-publish-app.yml'

  schedule:
    - cron: '0 10 * * *' # everyday at 10am

  # Allow job to be triggered manually.
  workflow_dispatch:

permissions: { }

# Cancel in-progress jobs when pushing to the same branch.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

# The name for the produced image at ghcr.io.
env:
  IMAGE_NAME_APP: "${{ github.repository }}-app"

jobs:
  build_and_test_app:
    runs-on: ubuntu-latest
    # a backstop under the 6h default: nothing here should take half an hour, and a job that hangs
    # holds the concurrency group against every later push to the branch
    timeout-minutes: 30
    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          target: prod
          load: true
          tags: wd-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build proves the image assembles, not that it boots. A missing runtime file, a bad CMD or
      # a server that exits on start all produce an image that builds green and serves nothing, and
      # this is the artifact that gets deployed -- so it is started and asked for a page first.
      - name: Serve a page from the image
        run: |
          docker run -d --name wd-app -p 4000:4000 wd-app:test

          # `--max-time` matters more than it looks: `-p` binds the host port the moment the
          # container starts, so a server that accepts connections and then never answers -- one of
          # the half-boots this step exists to catch -- would block the first curl indefinitely and
          # hang the job rather than fail it. The deadline is wall clock for the same reason.
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS --max-time 5 -o index.html http://127.0.0.1:4000/; then
              served=1
              break
            fi
            sleep 2
          done

          if [ -z "${served:-}" ]; then
            echo "::error::the image served nothing on :4000 within 90s"
            docker logs wd-app
            exit 1
          fi

          # 200 from something is not enough: it has to be our shell, with the client bundle
          # mounted into it. SSR is off, so this page renders without the backend.
          if ! grep -q '<title>Wetterdienst</title>' index.html || ! grep -q 'id="__nuxt"' index.html; then
            echo "::error::the page served on :4000 is not the wetterdienst spa shell"
            head -c 2000 index.html
            docker logs wd-app
            exit 1
          fi

      - name: Stop the image
        if: always()
        # cleanup must not turn a passing run red, nor mask why a failing one failed
        run: docker rm -f wd-app || true

  # Computes the version/tags/labels once, shared by the per-platform build jobs
  # and the final manifest-merge job. Skipped on pull requests along with both of them, so it
  # does not burn a runner computing tags no remaining job reads.
  docker_meta:
    needs: build_and_test_app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' && ! startsWith(github.actor, 'dependabot') }}
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" =~ ^app-v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME_APP }}
          tags: |
            type=schedule,pattern=nightly
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}

      - name: Inspect meta
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          echo "Tags:      ${TAGS}"
          echo "Labels:    ${LABELS}"

  # Builds each platform natively on its own runner (no QEMU emulation) and pushes an untagged,
  # digest-addressed image. Not on pull requests: those are checked by build_and_test_app
  # above, which builds the same target without pushing. Every other event does run this --
  # a workflow_dispatch from a branch included, though that one cannot get as far as deploying,
  # since no tag is computed for it and the merge job fails on the empty tag list.
  # linux/arm64 under QEMU
  # emulation on an amd64 runner took ~17 minutes (mostly `pnpm run build`,
  # which is CPU-bound and emulates very poorly); native arm64 runners
  # (free for public repos: https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/)
  # build at native speed instead.
  docker_app_build:
    needs: docker_meta
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      packages: write

    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          target: prod
          platforms: linux/${{ matrix.arch }}
          labels: ${{ needs.docker_meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_NAME_APP }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
          provenance: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-platform digests into a single multi-arch manifest under
  # the real tags, then deploys. Not on pull requests: the last step calls the Coolify deploy
  # hook, which redeploys the live site, and a proposed change must not do that. The backend
  # workflow guards its publish jobs the same way.
  docker_app_merge:
    needs: [ docker_meta, docker_app_build ]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write

    steps:
      # no checkout: nothing here reads the repository, only the digests the build jobs uploaded
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          META_TAGS: ${{ needs.docker_meta.outputs.tags }}
          IMAGE_NAME: ${{ env.IMAGE_NAME_APP }}
        run: |
          tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tags+=("-t" "$tag")
          done <<< "$META_TAGS"
          refs=()
          for digest in *; do
            refs+=("ghcr.io/${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Inspect image
        env:
          META_TAGS: ${{ needs.docker_meta.outputs.tags }}
        run: |
          first_tag=$(head -n1 <<< "$META_TAGS")
          docker buildx imagetools inspect "$first_tag"

      # the secrets are read from the environment, not written into the script: a template in `run:`
      # is expanded into the shell source before it runs
      - name: Deploy to Coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          curl --fail --request POST \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "https://coolify.eobs.org/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false"
