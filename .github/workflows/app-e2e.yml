name: App E2E

# The E2E suite runs the app against a live backend started from src/, so a change
# to either side can break it. Its filter therefore covers both, unlike app-tests.yml,
# whose node checks only ever read the app.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'src/wetterdienst/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/app-e2e.yml'
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'src/wetterdienst/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/app-e2e.yml'

  # Allow job to be triggered manually
  workflow_dispatch:

# A push to a pull request cancels the run it supersedes; a run on main always completes
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install backend dependencies
        working-directory: .
        run: |
          uv sync --no-dev --extra restapi
          uv pip list

      - name: Verify wetterdienst installation
        working-directory: .
        run: |
          uv run wetterdienst --version
          uv run wetterdienst info

      - name: Start backend
        working-directory: .
        run: |
          uv run wetterdienst restapi --listen 0.0.0.0:7890 > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend started with PID $(cat backend.pid)"

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -f http://localhost:7890/health > /dev/null 2>&1; then
              echo "✅ Backend is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Backend not ready yet, waiting..."
            sleep 2
          done
          echo "❌ Backend failed to start within 60 seconds"
          echo "Backend logs:"
          cat backend.log || echo "No backend logs found"
          exit 1

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          BACKEND_URL: http://localhost:7890
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-logs
          path: backend.log
          retention-days: 3

      - name: Stop backend
        if: always()
        working-directory: .
        run: |
          if [ -f backend.pid ]; then
            echo "Stopping backend process $(cat backend.pid)"
            kill "$(cat backend.pid)" || true
            rm backend.pid
          fi
          # Also try to kill any remaining wetterdienst processes
          pkill -f "wetterdienst restapi" || true
