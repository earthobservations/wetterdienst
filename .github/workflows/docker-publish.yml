# Stage Docker images through GitHub Actions (GHA) to GitHub Container Registry (GHCR).
#
# Multi-arch strategy: each platform is built natively on its own runner
# (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) and pushed by digest, then a
# merge job assembles the multi-arch manifest list. This avoids slow QEMU emulation.
#
# Derived from:
# https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
name: Release Docker Backend

on:
  push:
    tags:
      - 'v*.*.*'           # Backend releases only (v0.117.0)
  pull_request:
    branches: [ main ]
    paths:
      - 'src/wetterdienst/**'
      - 'docker/Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docker-publish.yml'

  # Allow job to be triggered manually.
  workflow_dispatch:

permissions: { }

# A push to a pull request cancels the run it supersedes; a run on a tag always completes.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

# The name for the produced image at ghcr.io.
env:
  IMAGE_NAME: "${{ github.repository }}"
  REGISTRY_IMAGE: "ghcr.io/${{ github.repository }}"

jobs:
  # PR gate / pre-release smoke test: build the amd64 image natively and run it.
  # No image is pushed here; multi-arch publishing happens only on non-PR events.
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: wd:test
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: Run tests
        run: |
          docker run wd:test wetterdienst info
          # the bindings of the `bufr` extra find an ecCodes library and its definitions, and pdbufr
          # decodes a BUFR message with them (GH-2409). pyproj is imported after eccodes: should an
          # eccodeslib wheel enter the lock, findlibs would load it ahead of the system library, and
          # its bundled PROJ aborts such a process at exit (ecmwf/eckit#354, GH-2441)
          docker run -i wd:test python - <<'EOF'
          import eccodes
          import pdbufr
          import pyproj  # noqa: F401
          from wetterdienst.util.eccodes import bufr_is_available

          assert bufr_is_available()
          sample = eccodes.codes_bufr_new_from_samples("BUFR4")
          eccodes.codes_set_array(sample, "unexpandedDescriptors", [12101])  # airTemperature
          eccodes.codes_set(sample, "airTemperature", 288.15)
          eccodes.codes_set(sample, "pack", 1)
          with open("/tmp/sample.bufr", "wb") as f:
              f.write(eccodes.codes_get_message(sample))
          df = pdbufr.read_bufr("/tmp/sample.bufr", columns=("airTemperature",))
          assert len(df) == 1 and abs(df["airTemperature"].iloc[0] - 288.15) < 1e-6, df
          EOF

      # The HEALTHCHECK finds the port the server listens on (GH-3346); production starts it on 3000, not on
      # the image's 7890, and a platform that defines no check of its own routes by this one. Only a Linux
      # container has the /proc/net tables it reads, so it is run here, with a start command on the other port.
      - name: Check the health check on the port of a start command
        run: |
          docker run -d --name wd-health wd:test wetterdienst restapi --listen 0.0.0.0:3000

          status=none
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(docker inspect -f '{{.State.Health.Status}}' wd-health)
            [ "$status" = healthy ] && break
            sleep 2
          done

          if [ "$status" != healthy ]; then
            echo "::error::the container was '${status}', not healthy, within 90s"
            docker inspect -f '{{json .State.Health}}' wd-health
            docker logs wd-health
            exit 1
          fi

      - name: Stop the container
        if: always()
        # cleanup must not turn a passing run red, nor mask why a failing one failed
        run: docker rm -f wd-health || true

  # Build each platform natively and push it by digest (release/manual only).
  build:
    needs: build_and_test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        id: prep
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.pair }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # BuildKit attaches a SLSA provenance and an SBOM to the digest as extra manifests of an image
          # index (platform unknown/unknown), which the merge job below carries into the manifest list
          provenance: mode=max
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.prep.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the multi-arch manifest list from the per-platform digests, then deploy.
  merge:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # both substitutions are meant to split into words: "-t <tag>" per tag, one reference per digest
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}"

      # the digest of the manifest list, which every tag points to, is what the attest job signs
      - name: Read the digest of the manifest list
        id: digest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for ${REGISTRY_IMAGE}:${VERSION}"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # the secrets are read from the environment, not written into the script: a template in `run:`
      # is expanded into the shell source before it runs
      - name: Deploy to Coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_BACKEND_UUID }}
        run: |
          curl --fail --request POST \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "https://coolify.eobs.org/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false"

  # Signs a SLSA build provenance of the manifest list with the identity of this workflow and stores it in
  # the GitHub attestations API and next to the image in the registry (`gh attestation verify`). It has the
  # tokens that sign and push and runs no code of the project; the merge job, which holds the deploy
  # secrets, has neither `id-token` nor `attestations`. The per-platform provenance and SBOM that BuildKit
  # made in the build jobs are unsigned records in the registry.
  attest:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      id-token: write
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Attest the provenance of the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ needs.merge.outputs.digest }}
          push-to-registry: true
          # the storage record needs `artifact-metadata: write`, and verification does not read it
          create-storage-record: false
