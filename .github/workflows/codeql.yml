name: CodeQL

# Never path-filtered: code scanning is a merge requirement in the repository ruleset, reported per
# pull request, so a run that does not happen leaves the pull request waiting (see README.md)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '26 4 * * 5'

# A push to a pull request cancels the CodeQL run it supersedes (4 runs stacked up for one branch,
# GH-4214); a run on main or on the schedule is never cancelled once it has started. The ruleset that
# requires code scanning checks the head commit of the pull request, so the cancelled run of an older
# commit is not one it waits for. Still no path filter on this workflow, see above: that is what
# leaves a pull request waiting.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # None of the three needs a build: python and javascript-typescript are interpreted, and
        # actions reads the workflow files themselves
        language: [ python, javascript-typescript, actions ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        languages: ${{ matrix.language }}
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        category: "/language:${{ matrix.language }}"
