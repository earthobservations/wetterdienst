name: Typecheck

# `typecheck` runs ty on src/wetterdienst only; the installed dependency versions it resolves
# imports against come from pyproject.toml/uv.lock. `installed` checks tests/typed_caller.py
# against the built wheel, installed into clean environments, as a caller's checker sees the package.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/wetterdienst/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/typed_caller.py'
      - 'tests/check_installed_typing.py'
      - '.github/workflows/typecheck.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/wetterdienst/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/typed_caller.py'
      - 'tests/check_installed_typing.py'
      - '.github/workflows/typecheck.yml'

  # Allow job to be triggered manually.
  workflow_dispatch:

# A push to a pull request cancels the run it supersedes; a run on main is never cancelled once it has started
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  PYTHON: "3.14"

permissions: {}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install project
        run: uv sync --all-extras

      - name: Run type checks
        run: uv run poe typecheck

  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install project
        run: uv sync --all-extras

      - name: Type-check the caller against the built wheel
        run: uv run poe "typecheck:installed"
