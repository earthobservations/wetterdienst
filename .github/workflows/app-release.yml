name: App Release

on:
  release:
    types: [ published ]

permissions: {}

jobs:
  check-release-type:
    runs-on: ubuntu-latest
    outputs:
      is-app: ${{ steps.check.outputs.is-app }}
    steps:
      - name: Check if app release
        id: check
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG_NAME" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-app=true" >> $GITHUB_OUTPUT
          else
            echo "is-app=false" >> $GITHUB_OUTPUT
          fi

  release:
    needs: check-release-type
    if: needs.check-release-type.outputs.is-app == 'true'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: app
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build app
        run: pnpm run build
      
      - name: Create release artifact
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          cd .output
          tar -czf ../app-"${TAG_NAME#app-}".tar.gz .

      - name: Upload release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" "app-${TAG_NAME#app-}.tar.gz"
