name: Coverage

# Same inputs as the test matrix - see tests.yml for why the docs, the one app file, the Dockerfile
# and the root files are in here.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      # tests/examples runs these, so a change to one is a change this suite covers
      - 'examples/**'
      # tests/test_docs.py and tests/test_docs_samples.py read the pages, the provider pages and the others
      - 'docs/**'
      - 'app/shared/types/api.ts'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
      # tests/test_docs.py ties the extras the image installs to the ones docs/usage/docker.md lists
      - 'docker/Dockerfile'
      - '.github/workflows/install.sh'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      # tests/examples runs these, so a change to one is a change this suite covers
      - 'examples/**'
      # tests/test_docs.py and tests/test_docs_samples.py read the pages, the provider pages and the others
      - 'docs/**'
      - 'app/shared/types/api.ts'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
      # tests/test_docs.py ties the extras the image installs to the ones docs/usage/docker.md lists
      - 'docker/Dockerfile'
      - '.github/workflows/install.sh'
      - '.github/workflows/coverage.yml'

  # Allow job to be triggered manually.
  workflow_dispatch:

# A push to a pull request cancels the run it supersedes; a run on main is never cancelled once it has started
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  OS: "ubuntu-latest"
  PYTHON: "3.14"

permissions: {}

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: codecov
    permissions:
      contents: read
    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install project
        run: uv sync

      - name: Install extras for testing
        run: .github/workflows/install.sh testing

      # the provider keys are given to the two test steps alone, not to `uv sync` or to the
      # third-party Codecov action
      - name: Run tests, with coverage (parallel)
        env:
          WD_AUTH__METNO_FROST: ${{ secrets.WD_AUTH__METNO_FROST }}
          WD_AUTH__AEMET: ${{ secrets.WD_AUTH__AEMET }}
          WD_AUTH__KNMI: ${{ secrets.WD_AUTH__KNMI }}
          WD_AUTH__CEDA: ${{ secrets.WD_AUTH__CEDA }}
        run: uv run poe coverage:parallel

      - name: Run tests, with coverage (cflakes)
        if: always()
        env:
          WD_AUTH__METNO_FROST: ${{ secrets.WD_AUTH__METNO_FROST }}
          WD_AUTH__AEMET: ${{ secrets.WD_AUTH__AEMET }}
          WD_AUTH__KNMI: ${{ secrets.WD_AUTH__KNMI }}
          WD_AUTH__CEDA: ${{ secrets.WD_AUTH__CEDA }}
        run: uv run poe coverage:cflakes

      - name: Upload coverage report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit-parallel.xml,./junit-cflakes.xml
          report_type: test_results
          fail_ci_if_error: false
