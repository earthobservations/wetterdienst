name: Coverage

# Same inputs as the test matrix - see tests.yml for why the docs and the three root
# files are in here.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
      - '.github/workflows/install.sh'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
      - '.github/workflows/install.sh'
      - '.github/workflows/coverage.yml'

  # Allow job to be triggered manually.
  workflow_dispatch:

# Cancel in-progress jobs when pushing to the same branch.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  OS: "ubuntu-latest"
  PYTHON: "3.14"
  WD_AUTH__METNO_FROST: ${{ secrets.WD_AUTH__METNO_FROST }}
  WD_AUTH__AEMET: ${{ secrets.WD_AUTH__AEMET }}
  WD_AUTH__KNMI: ${{ secrets.WD_AUTH__KNMI }}
  WD_AUTH__CEDA: ${{ secrets.WD_AUTH__CEDA }}

permissions: {}

jobs:
  coverage:
    runs-on: ubuntu-latest
    environment: codecov
    permissions:
      contents: read
    steps:
      - name: Acquire sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install project
        run: uv sync

      - name: Install extras for testing
        run: .github/workflows/install.sh testing

      - name: Run tests, with coverage (parallel)
        run: uv run poe coverage:parallel

      - name: Run tests, with coverage (cflakes)
        if: always()
        run: uv run poe coverage:cflakes

      - name: Upload coverage report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit-parallel.xml,./junit-cflakes.xml
          report_type: test_results
          fail_ci_if_error: false
