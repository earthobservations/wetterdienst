name: Backend Release

on:
  release:
    types: [ published ]

env:
  PYTHON: "3.14"

permissions: {}

jobs:
  check-release-type:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is-backend: ${{ steps.check.outputs.is-backend }}
    steps:
      - name: Check if backend release
        id: check
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Backend releases use tags like v0.117.0 (not starting with 'app-')
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-backend=false" >> "$GITHUB_OUTPUT"
          fi

  # Builds the distributions in a job without `id-token`: `uv build` runs the build code of the project
  # and of its build requirements, and must not be able to mint the PyPI trusted-publishing token that
  # publishes what it produces. It builds in an isolated environment, so no `uv sync` precedes it.
  build:
    needs: check-release-type
    if: needs.check-release-type.outputs.is-backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # the uv of docker/Dockerfile and .readthedocs.yml: move the three together
          version: "0.13.5"
          enable-cache: false
          python-version: ${{ env.PYTHON }}

      - name: Build
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Holds the token and runs no project or dependency code: no checkout, no build, only the
  # distributions the build job produced. `uv publish` uploads attestations it finds next to the
  # distributions but does not make them, so the PyPA action publishes: it signs a PEP 740 publish
  # attestation of each file with the OIDC identity of this job (the trusted publisher) and uploads it
  # along with the file (GH-3346)
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
