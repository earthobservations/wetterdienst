name: Lint

# ruff only ever looks at the trees named in `include` in pyproject.toml, so nothing
# outside them - the app, the docs, the notebooks - can change the outcome.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/lint.yml'

  # Allow job to be triggered manually.
  workflow_dispatch:

# A push to a pull request cancels the run it supersedes; a run on main is never cancelled once it has started
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  PYTHON: "3.14"

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install project
        run: uv sync

      - name: Run code-style checks
        run: uv run poe lint
