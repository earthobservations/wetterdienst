[project]
name = "wetterdienst"
version = "0.175.0"
authors = [
    { name = "Benjamin Gutzmann", email = "benjamin@eobs.org" },
    { name = "Andreas Motl", email = "andreas.motl@panodata.org" },
]
description = "Open weather data for humans"
readme = "README.md"
# Migrate license metadata to PEP 639: use SPDX expression and explicit license files
license-expression = "MIT"
license-files = ["LICENSE.md"]
keywords = [
    # AEMET
    "aemet",
    "state-meteorological-agency-of-spain",
    # DMI
    "dmi",
    "danish-meteorological-institute",
    # SMHI
    "smhi",
    "swedish-meteorological-and-hydrological-institute",
    # KNMI
    "knmi",
    "royal-netherlands-meteorological-institute",
    # DWD
    "deutscher-wetterdienst",
    "dmo",
    # Eaufrance Hubeau
    "eaufrance-hubeau",
    # ECCC
    "environment-and-climate-change-canada",
    # EA
    "environmental-agency-uk",
    # WSV
    "federal-waterways-and-shipping-administration-germany",
    "forecast",
    # Geosphere Austria
    "geosphere-austria",
    "ghcn",
    "historical",
    # IMGW
    "institute-of-meteorology-and-water-management-poland",
    # Météo-France
    "meteo-france",
    "synop",
    # MeteoSwiss
    "federal-office-of-meteorology-and-climatology-switzerland",
    "meteoswiss",
    "mosmix",
    # MET Norway
    "met-norway",
    "norwegian-meteorological-institute",
    "frost",
    # NOAA
    "national-oceanic-and-atmospheric-administration",
    # NWS
    "national-weather-service",
    # RMI
    "royal-meteorological-institute-of-belgium",
    "near-real-time",
    "observation",
    "open-data",
    "open-source",
    "radar",
    "radolan",
    "recent",
    "time-series",
    "weather-api",
    "weather-data",
    "weather-station",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications",
    "Topic :: Database",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Archiving",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.4,<4",
    "certifi>=2026.10.19",  # drops the emSign ECC Root CA - G3 (GHSA-6q48-6c7w-9gw2, GH-3331)
    "click>=8.2,<9",
    "fsspec[http]>=2026.6.0",
    "lxml>=4.9.1,<7",
    "measurement>=3.2,<4",
    "platformdirs>=4,<5",
    "polars[calamine]>=1.43.2,<3",
    "portion>=2.4.2,<3",
    "pyarrow>=22.0.0",
    "pydantic>=2.7.3,<3",
    "pydantic-core>=2.18.4,<3",
    "pydantic-extra-types>=2.10.1,<3",
    "pydantic-settings>=2.14.0,<3",
    "python-dateutil>=2.8.2,<3",
    "rapidfuzz>=3.1,<4",
    "stamina>=25.1.0,<27",
    "tabulate>=0.9,<1",
    "tqdm>=4.64,<5",
    # every `TypedDict` in the package (model/result.py, ui/core.py, ui/restapi.py) comes from here, not from
    # `typing`: pydantic refuses typing.TypedDict as a response model below Python 3.12
    "typing-extensions>=4.15.0,<5",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
bufr = [
    # the whole of what reading BUFR takes. pdbufr requires eccodes and would bring it unasked,
    # but it asks for any version at all -- so the floor is named here too, or a consumer
    # resolving `wetterdienst[bufr]` may be handed the 2023 source tarball this floor exists to
    # keep out. Inside this repo one lock covers every extra and the `eccodes` extra below would
    # have bound it either way; a consumer installing this extra alone has no such luck
    "eccodes>=1.7.1,<3",
    "pdbufr>=0.10.2,<1",
]
cratedb = [
    "pandas>=2.2.2,<4",
    "sqlalchemy-cratedb>=0.40,<1",
]
duckdb = [
    "duckdb>=1.1.0,<2",
    "pandas>=2.2.2,<4",
]
# kept for the installs that name it; `bufr` carries this and the reader both. The floor is the
# oldest release published as a wheel: 1.5.2 stood here and is a 2023 source tarball, which the
# minimum-versions job -- resolving every direct dependency to its floor, across extras, whether
# or not this one is installed -- would have had to build, and would have continued on error if it
# could not. Raising it only that far is deliberate: `ensure_eccodes` asks for
# `codes_get_api_version`, which 1.x has, so nothing here needs 2.x and an install pinned to 1.x
# keeps resolving
eccodes = [
    "eccodes>=1.7.1,<3",
]
excel = [
    "xlsxwriter>=3.0.9,<4",
]
export = [
    # xarray writes NetCDF through an engine, and this is the one that needs no compiled netCDF
    "h5netcdf>=1.7.3,<2",
    "pandas>=2.2.2,<4",
    "sqlalchemy>=2,<3",
    # before 2025.6.0, open_zarr fails on stores written with zarr>=3.1 (GH-2704)
    "xarray>=2025.6.0,<2027",
    "xlsxwriter>=3.0.9,<4",
    "zarr>=3.1,<4",
]
influxdb = [
    "influxdb>=5.3.1,<6",
    "influxdb-client>=1.18,<2",
    "influxdb3-python>=0.3,<1",
    # influxdb 5.3.0 pinned 0.6.1 and 5.3.1 leaves it unbounded, so an installed 0.6.1 would stay (GHSA-6v7p-g79w-8964)
    "msgpack>=1.2.1,<2",
]
knmi = [
    "h5netcdf>=1.7.3,<2",
    "h5py>=3.11,<4",
]
interpolation = [
    "scipy>=1.14.1,<2",
    # 2.0.6 is the first release that works with numpy 2, which everything else here resolves to.
    # Before it, building a geometry from coordinates raises out of `create_collection`
    "shapely>=2.0.6,<3",
    # 0.8 is the first release whose `from_latlon` takes the hemisphere from a forced zone letter.
    # Before it, a station south of the equator gets the false northing whatever the letter says
    "utm>=0.8,<1",
]
# `mysql` and `postgresql` carry what the SQL sink imports, so either works without `export`
mysql = [
    "mysqlclient>=2,<3",
    "pandas>=2.2.2,<4",
    "sqlalchemy>=2,<3",
]
pdf = [
    "pypdf>=6.21.2,<7",
]
plotting = [
    "kaleido>=1.0.0",
    "plotly>=6.1.1",
]
postgresql = [
    "pandas>=2.2.2,<4",
    # psycopg 3, which the sink names for a bare `postgresql://`; 3.0.2 is SQLAlchemy's floor for it
    "psycopg[binary]>=3.0.2,<4",
    "sqlalchemy>=2,<3",
]
radar = [
    "h5netcdf>=1.7.3",
    "h5py>=3.11,<4",
]
radarplus = [
    # 2.6.0 is the first release whose `radolan` backend reads the ODIM HDF5 file DWD serves as the
    # RADOLAN RW (and the like); before it, opening one raises a `UnicodeDecodeError` (GH-3329)
    "wradlib>=2.6.0,<3",
    "xradar>=0.8,<1",
]
restapi = [
    # >=0.142: ui/restapi.py passes `FastAPI(telemetry=...)`, which 0.142 added
    "fastapi>=0.142,<1",
    # ui/restapi.py imports starlette.exceptions.HTTPException and registers a handler for it; >=1.3: the first
    # release whose starlette.testclient takes httpx2 (the project's dev group has httpx2 only, no httpx)
    "starlette>=1.3,<2",
    "uvicorn[standard]>=0.30,<1",
]
sql = [
    "duckdb>=1.1.0,<2",
]
mcp = [
    "wetterdienst[restapi]",
    # >=4: the OpenAPIProvider takes an httpx2 client there, where 3.x took an httpx one;
    # >=4.1.2 for GHSA-vqqp-x5qm-5qp4 and GHSA-7xgj-8392-5q4r
    "fastmcp>=4.1.2,<5",
    # ui/mcp.py builds the OpenAPIProvider's ASGI client with it; >=2.12 for CVE-2026-84379/80/82
    "httpx2>=2.12,<3",
]

[project.urls]
Homepage = "https://wetterdienst.readthedocs.io/"
Issues = "https://github.com/earthobservations/wetterdienst/issues"
Releases = "https://github.com/earthobservations/wetterdienst/releases"
Repository = "https://github.com/earthobservations/wetterdienst"
Restapi = "https://wetterdienst.eobs.org/"

[project.scripts]
wddump = "wetterdienst.provider.dwd.radar.cli:wddump"
wetterdienst = "wetterdienst.ui.cli:cli"

[build-system]
requires = ["uv_build>=0.9.21,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# Development tooling floors are kept close to the versions we actually develop against,
# so that the `minimum versions` CI job only exercises the floors of the *runtime*
# dependencies declared in [project] and [project.optional-dependencies].
dev = [
    # general
    "dirty-equals>=0.11",
    "freezegun>=1.5.5",
    "h5py>=3.11",
    "lmfit>=1.3.4",
    "matplotlib>=3.10,<4",
    # in-memory span and metric readers for the tests of the REST API's OpenTelemetry
    "opentelemetry-sdk>=1.45",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    # 16.7 matches `--only-rerun` against the cause chain too, which tests/conftest.py's `_rerun_will_retry` models
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8",
    "pyyaml>=6",
    # formatting and linting
    "ruff>=0.16.0",
    "poethepoet>=0.48.0",
    "zizmor>=1.28.0",
    "deptry>=0.25.1",
    "ty>=0.0.64",
    "httpx2>=2.12",
]

docs = [
    "myst-nb-json>=0.1.3",
    "myst-nb>=1.2.0",
    "myst-parser>=4.0.1",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx>=8.1.3",
]

[tool.poe.tasks]
# Formatting and linting
"format:fmt" = "uv run ruff format"
"format:lint" = "uv run ruff check --fix"
format = ["format:fmt", "format:lint"]
"lint:fmt" = "uv run ruff format --check"
"lint:lint" = "uv run ruff check"
lint = ["lint:fmt", "lint:lint"]
unused = "uv run deptry src/wetterdienst"
vulnerable = "uv audit"
zizmor = "uv run zizmor ."
# docs -- the same build Read the Docs runs, which is sphinx against docs/conf.py. There is no
# Makefile in docs/, so `make html` had nothing to make
docs = "uv run --group docs sphinx-build --builder html docs docs/_build/html"
# the external links of the pages, with the notebooks not executed. Needs the internet, so it is not part of any test
"docs:linkcheck" = "uv run --group docs sphinx-build --builder linkcheck -D nb_execution_mode=off docs docs/_build/linkcheck"
"docs:clean" = "uv run python -c \"import shutil; shutil.rmtree('docs/_build', ignore_errors=True)\""
"test:parallel" = "uv run pytest -vvv --numprocesses=auto -m 'not (explorer or cflake)'"
"test:cflakes" = "uv run pytest -vvv -m cflake"
# The offline selection, which `tests/conftest.py` holds to being offline by refusing non-local
# names and addresses. Run on its own rather than as part of `test`, because the whole suite warms
# the cache and the fsspec session that a later unmarked test would otherwise be served from --
# reading a url a `remote` test already fetched opens no socket, and the guard sees nothing to
# refuse. Only a run without the remote tests in it asks the question this answers.
#
# Serial, unlike `test:parallel`: the selection holds two `cflake` tests, and xdist is the
# concurrency they are flaky under. 30s that way against 13s split in two, which is not worth a
# second task that could quietly collect nothing and still go green. `explorer` is excluded as
# `test:parallel` excludes it -- no job here runs those, and nothing in the tree is marked (GH-2003)
"test:offline" = "uv run pytest -m 'not (remote or explorer)'"
test = ["test:parallel", "test:cflakes"]
# For Windows CI
test-slow = "uv run pytest"
"coverage:parallel" = "uv run pytest --cov-report xml --cov wetterdienst tests/ --numprocesses=auto -m 'not (explorer or cflake)' --junitxml=junit-parallel.xml"
"coverage:cflakes" = "uv run pytest --cov-report xml --cov-append --cov wetterdienst tests/ -m cflake --junitxml=junit-cflakes.xml"
coverage = [
    "coverage:parallel",
    "coverage:cflakes",
]
# the OpenAPI document as committed (tests/ui/openapi.snapshot.json), which a test holds the served one to: run after a
# change to the contract, and read the diff
"openapi:snapshot" = "uv run python -m tests.ui.openapi_snapshot"
# the surfaces of the last release, which a test holds the code to (nothing they offered may be gone): the OpenAPI
# document, the `--help` of every command, the public surface of the Python API, the MCP tools and the parameters of
# every dataset. Run `contracts:baseline` once for a release, in the release commit, see .github/RELEASE_STRATEGY.md
"openapi:baseline" = "uv run python -m tests.ui.openapi_baseline"
"cli:baseline" = "uv run python -m tests.baselines.cli"
"surface:baseline" = "uv run python -m tests.baselines.surface"
"mcp:baseline" = "uv run python -m tests.baselines.mcp"
"parameters:baseline" = "uv run python -m tests.baselines.parameters"
"contracts:baseline" = [
    "openapi:baseline",
    "cli:baseline",
    "surface:baseline",
    "mcp:baseline",
    "parameters:baseline",
]
# the `--help` of every command (tests/ui/cli/help.snapshot.txt) and the public surface of the Python API
# (tests/public_surface.snapshot.json), each held by a test: run after an intended change, and read the diff
"cli:snapshot" = "uv run python -m tests.ui.cli.help_snapshot"
"surface:snapshot" = "uv run python -m tests.public_surface"
# all three snapshots of the contract
# the parameters of release 0.139.0 that are gone (tests/metadata/gone_since_0_139_0.json), which a test holds to a
# replacement or a reason; regenerated from the tag `v0.139.0` (`git fetch --tags`) when a parameter of it is renamed,
# removed or back, and a regeneration changes nothing otherwise
"renames:baseline" = "uv run python -m tests.metadata.baseline_0_139_0"
"contracts:snapshot" = [
    "openapi:snapshot",
    "cli:snapshot",
    "surface:snapshot",
]
# the frames the core hands out for every offline fixture of `tests/provider` (tests/provider/frames.snapshot.json),
# which each of those tests is held to: run after an intended change, and read the diff. One process (`-n0`): the file
# is written from the whole selection, and a failing test leaves it as it was
"frames:snapshot" = { cmd = "uv run pytest tests/provider -m 'not (remote or explorer)' -n0 -q", env = { WD_FRAMES_SNAPSHOT = "write" } }
typecheck = "uv run ty check src/wetterdienst"
# what a caller's checker makes of the wheel: builds it, installs it into clean environments and checks
# `tests/typed_caller.py` against it, which `typecheck` (the checkout, read as first-party code) cannot say
"typecheck:installed" = "uv run python tests/check_installed_typing.py"
sync = "uv sync"
lock = "uv lock"

[tool.ty.environment]
# the oldest supported Python, which is what `requires-python` already implies: named here so that
# raising the floor there is a decision made again in ruff's and ty's settings, not a side effect
python-version = "3.11"

[tool.ty.rules]
unresolved-import = "warn"
# an ignore comment that silences nothing is a fix that forgot to take it out
unused-ignore-comment = "error"

[tool.ty.analysis]
allowed-unresolved-imports = ["lxml.*", "tabula", "tabula.*"]

[tool.ruff]
line-length = 120
# the oldest supported Python: keep in step with `requires-python` and `[tool.ty.environment]`
target-version = "py311"
include = [
    "benchmarks/**/*.py",
    "examples/**/*.py",
    "tests/**/*.py",
    "src/wetterdienst/**/*.py",
]
extend-include = [
    "*.ipynb",
]
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # flake8-todos
    "TD",
    # flake8-fixme
    "FIX",
    # pandas-vet
    "PD",
    # Pylint
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLW2901",
    # flake8-copyright (project does not use per-file copyright headers)
    "CPY001",
    # Perflint (PERF)
    "PERF",
    # flake8-logging-format
    "G004",
    # ignore this because of warning by ruff
    "COM812"
]
unfixable = ["ERA", "F401", "F841", "T20", "ERA001"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "D104"]
"tests/*" = ["S101"]
"benchmarks/*" = ["T20", "INP001"]
"examples/*" = ["T20", "INP001"]

[tool.deptry]
known_first_party = ["wetterdienst"]

[tool.deptry.package_module_name_map]
influxdb3-python = "influxdb_client_3"
scikit-learn = "sklearn"

[tool.deptry.per_rule_ignores]
DEP002 = [
    # imported by name through `util.extras.import_optional`, which deptry does not read as an import
    "duckdb",
    "h5netcdf",
    "h5py",
    "influxdb",
    "influxdb-client",
    "influxdb3-python",
    "kaleido",
    "msgpack",
    "mysqlclient",
    "pandas",
    "plotly",
    "psycopg",
    "pypdf",
    "sqlalchemy-cratedb",
    "tzdata",
    "uvicorn",
    # self-referential extra: the `mcp` extra pulls in `wetterdienst[restapi]`, which is never imported
    "wetterdienst",
    "wradlib",
    "xarray",
    "xlsxwriter",
    "xradar",
    "zarr"
]
# pyproj is imported only where installed, ahead of eccodes (`util/eccodes.py`, GH-2468), and not
# needed otherwise: `radarplus` brings it through wradlib and xradar. Missing where it is not
# installed, transitive where it is.
# tabula is tabula-py, which only the maintainers' radar-sites generator imports
# (`provider/dwd/radar/sites.py`): no extra names it, because it needs a Java runtime (GH-2764)
DEP001 = ["pyproj", "tabula"]
# mcp_types is where fastmcp takes `ToolAnnotations` from (`ui/mcp.py`); it re-exports it nowhere
DEP003 = ["mcp_types", "pyproj"]

[tool.pytest.ini_options]
addopts = "-rsfEX -p pytester --strict-markers --verbosity=3 --only-rerun FSTimeoutError --only-rerun ConnectionTimeoutError --only-rerun ClientResponseError"
#log_cli = true
#log_cli_level = "DEBUG"
log_date_format = "%Y-%m-%dT%H:%M:%S"
log_format = "%(asctime)-15s.%(msecs)03d [%(name)-35s] %(levelname)-8s: %(message)s"
log_level = "DEBUG"
markers = [
    "remote: Tests accessing the internet.",
    "resolver_fails: Hosts a runner's resolver fails to resolve (host, ..., platform=): a remote test skips on them.",
    "slow: Slow tests.",
    "sql: All tests related to SQL.",
    "explorer: All tests related to the explorer UI.",
    "cflake: Tests which are flaky under concurrency",
    "synthetic_values: Provider tests served numbers that are no readings, so the physical range check stands aside.",
]
minversion = "2.0"
testpaths = ["tests"]
# Detect tests marked with xfail, which are actually succeeding.
# xfail_strict = true

# Retry flaky tests, thereby improving the consistency of the test suite results.
# --only-rerun flags in addopts restrict retries to transient network errors.
reruns = 2
reruns_delay = 5

[tool.coverage.run]
branch = true
source = ["src/wetterdienst"]
[tool.coverage.report]
show_missing = true
fail_under = 0
omit = [
    "tests/*",
    "src/wetterdienst/provider/dwd/radar/cli.py",
]

[tool.uv]
# Cooldown: ignore releases younger than this, so freshly published (and possibly
# yanked or broken) versions never enter the lockfile.
exclude-newer = "3 days"
