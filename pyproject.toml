[project]
name = "wetterdienst"
version = "0.132.0"
authors = [
    { name = "Benjamin Gutzmann", email = "benjamin@eobs.org" },
    { name = "Andreas Motl", email = "andreas.motl@panodata.org" },
]
description = "Open weather data for humans"
readme = "README.md"
# Migrate license metadata to PEP 639: use SPDX expression and explicit license files
license-expression = "MIT"
license-files = ["LICENSE.md"]
keywords = [
    # AEMET
    "aemet",
    "state-meteorological-agency-of-spain",
    # DMI
    "dmi",
    "danish-meteorological-institute",
    # SMHI
    "smhi",
    "swedish-meteorological-and-hydrological-institute",
    # KNMI
    "knmi",
    "royal-netherlands-meteorological-institute",
    # DWD
    "deutscher-wetterdienst",
    "dmo",
    # Eaufrance Hubeau
    "eaufrance-hubeau",
    # ECCC
    "environment-and-climate-change-canada",
    # EA
    "environmental-agency-uk",
    # WSV
    "federal-waterways-and-shipping-administration-germany",
    "forecast",
    # Geosphere Austria
    "geosphere-austria",
    "ghcn",
    "historical",
    # IMGW
    "institute-of-meteorology-and-water-management-poland",
    # Météo-France
    "meteo-france",
    "synop",
    # MeteoSwiss
    "federal-office-of-meteorology-and-climatology-switzerland",
    "meteoswiss",
    "mosmix",
    # MET Norway
    "met-norway",
    "norwegian-meteorological-institute",
    "frost",
    # NOAA
    "national-oceanic-and-atmospheric-administration",
    # NWS
    "national-weather-service",
    # RMI
    "royal-meteorological-institute-of-belgium",
    "near-real-time",
    "observation",
    "open-data",
    "open-source",
    "radar",
    "radolan",
    "recent",
    "time-series",
    "weather-api",
    "weather-data",
    "weather-station",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Database",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Archiving",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.0,<4",
    "backports-datetime-fromisoformat>=2; python_version<'3.11'",
    "certifi>=2024.2.2",
    "click>=8.2,<9",
    "cloup>=3.0.1,<4",
    "fsspec[http]>=2024.6",
    "lxml>=4.9.1,<7",
    "measurement>=3.2,<4",
    "platformdirs>=4,<5",
    "polars[calamine]>=1.43.0,<2",
    "portion>=2.4.2,<3",
    "pyarrow>=22.0.0",
    "pydantic>=2.7.3,<3",
    "pydantic-extra-types>=2.10.1,<3",
    "pydantic-settings>=2.7.0,<3",
    "python-dateutil>=2.8.2,<3",
    "rapidfuzz>=3.1,<4",
    "diskcache>=5.6.3,<6",
    "stamina>=25.1.0,<27",
    "tabulate>=0.9,<1",
    "tqdm>=4.64,<5",
    # imported unconditionally by model/result.py and ui/core.py, not just as a 3.10 backport:
    # pydantic refuses typing.TypedDict as a response model below 3.12
    "typing-extensions>=4.15.0,<5",
    "tzdata>=2024.2",
    "tzfpy>=0.15.2,<2",
]

[project.optional-dependencies]
bufr = [
    "pdbufr>=0.10.2,<1",
    "pybufrkit>=0.2,<1",
]
cratedb = [
    "pandas>=2.2.2,<4",
    "sqlalchemy-cratedb>=0.40,<1",
]
duckdb = [
    "duckdb>=1,<2",
    "pandas>=2.2.2,<4",
]
eccodes = [
    "eccodes>=1.5.2,<3",
]
excel = [
    "xlsxwriter>=3.0.9,<4",
]
export = [
    "pandas>=2.2.2,<4",
    "sqlalchemy>=2,<3",
    "xarray>=2024.6,<2027",
    "xlsxwriter>=3.0.9,<4",
    "zarr>=3.1,<4;python_version>='3.11'",
]
influxdb = [
    "influxdb>=5.3,<6",
    "influxdb-client>=1.18,<2",
    "influxdb3-python>=0.3,<1",
]
knmi = [
    "h5netcdf>=1.7.3,<2",
    "h5py>=3.11,<4",
]
interpolation = [
    "scipy>=1.14.1,<2",
    "shapely>=2.0.4,<3",
    "utm>=0.7,<1",
]
mysql = [
    "mysqlclient>=2,<3",
    "pandas>=2.2.2,<3",
]
pdf = [
    "pypdf>=3.12.1,<7",
]
plotting = [
    "kaleido>=1.0.0",
    "plotly>=6.1.1",
]
postgresql = [
    "psycopg2-binary>=2,<3",
]
radar = [
    "h5netcdf>=1.7.3",
    "h5py>=3.11,<4",
    "tabula>=1.0.5",
]
radarplus = [
    "pybufrkit>=0.2,<1",
    "wradlib>=2.0.1,<3",
    "xradar>=0.2,<1",
]
restapi = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]
sql = [
    "duckdb>=1,<2",
]
mcp = [
    "wetterdienst[restapi]",
    "fastmcp>=3.4.4,<4.0.0",
]

[project.urls]
Homepage = "https://wetterdienst.readthedocs.io/"
Issues = "https://github.com/earthobservations/wetterdienst/issues"
Releases = "https://github.com/earthobservations/wetterdienst/releases"
Repository = "https://github.com/earthobservations/wetterdienst"
Restapi = "https://wetterdienst.eobs.org/"

[project.scripts]
wddump = "wetterdienst.provider.dwd.radar.cli:wddump"
wetterdienst = "wetterdienst.ui.cli:cli"

[build-system]
requires = ["uv_build>=0.9.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
# Development tooling floors are kept close to the versions we actually develop against,
# so that the `minimum versions` CI job only exercises the floors of the *runtime*
# dependencies declared in [project] and [project.optional-dependencies].
dev = [
    # general
    "dirty-equals>=0.11",
    "freezegun>=1.5.5",
    "h5py>=3.11",
    "lmfit>=1.3.4",
    "matplotlib>=3.10,<4",
    "pybufrkit>=0.2.25",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-rerunfailures>=16.4",
    "pytest-xdist>=3.8",
    "pyyaml>=6",
    # formatting and linting
    "ruff>=0.16.0",
    "poethepoet>=0.48.0",
    "zizmor>=1.28.0",
    "deptry>=0.25.1",
    "ty>=0.0.64",
    "httpx2>=2.4.0",
]

docs = [
    "myst-nb-json>=0.1.3",
    "myst-nb>=1.2.0",
    "myst-parser>=4.0.1",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx>=8.1.3",
]

[tool.poe.tasks]
# Formatting and linting
"format:fmt" = "uv run ruff format"
"format:lint" = "uv run ruff check --fix"
format = ["format:fmt", "format:lint"]
"lint:fmt" = "uv run ruff format --check"
"lint:lint" = "uv run ruff check"
lint = ["lint:fmt", "lint:lint"]
unused = "uv run deptry src/wetterdienst"
vulnerable = "uv audit"
zizmor = "uv run zizmor ."
# docs
docs = "cd docs && make html"
"test:parallel" = "uv run pytest -vvv --numprocesses=auto -m 'not (explorer or cflake)'"
"test:cflakes" = "uv run pytest -vvv -m cflake"
test = ["test:parallel", "test:cflakes"]
# For Windows CI
test-slow = "uv run pytest"
"coverage:parallel" = "uv run pytest --cov-report xml --cov wetterdienst tests/ --numprocesses=auto -m 'not (explorer or cflake)' --junitxml=junit-parallel.xml"
"coverage:cflakes" = "uv run pytest --cov-report xml --cov-append --cov wetterdienst tests/ -m cflake --junitxml=junit-cflakes.xml"
coverage = [
    "coverage:parallel",
    "coverage:cflakes",
]
typecheck = "uv run ty check src/wetterdienst"
sync = "uv sync"
lock = "uv lock"

[tool.ty.rules]
unresolved-import = "warn"

[tool.ty.analysis]
allowed-unresolved-imports = ["backports.*", "lxml.*", "tabula.*"]

[tool.ruff]
line-length = 120
include = [
    "benchmarks/**/*.py",
    "examples/**/*.py",
    "tests/**/*.py",
    "src/wetterdienst/**/*.py",
]
extend-include = [
    "*.ipynb",
]
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # flake8-todos
    "TD",
    # flake8-fixme
    "FIX",
    # pandas-vet
    "PD",
    # Pylint
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLW2901",
    # flake8-copyright (project does not use per-file copyright headers)
    "CPY001",
    # Perflint (PERF)
    "PERF",
    # flake8-logging-format
    "G004",
    # ignore this because of warning by ruff
    "COM812"
]
unfixable = ["ERA", "F401", "F841", "T20", "ERA001"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "D104"]
"tests/*" = ["S101"]
"benchmarks/*" = ["T20", "INP001"]
"examples/*" = ["T20", "INP001"]

[tool.deptry]
known_first_party = ["wetterdienst"]

[tool.deptry.package_module_name_map]
backports-datetime-fromisoformat = "backports"
influxdb3-python = "influxdb_client_3"
scikit-learn = "sklearn"

[tool.deptry.per_rule_ignores]
DEP002 = [
    "httpx",
    "httpx2",
    "kaleido",
    "mysqlclient",
    "pandas",
    "psycopg2-binary",
    "pybufrkit",
    "sqlalchemy-cratedb",
    "tzdata",
    # self-referential extra: the `mcp` extra pulls in `wetterdienst[restapi]`, which is never imported
    "wetterdienst",
    "wradlib",
    "xlsxwriter",
    "xradar",
    "zarr"
]

[tool.pytest.ini_options]
addopts = "-rsfEX -p pytester --strict-markers --verbosity=3 --only-rerun FSTimeoutError --only-rerun ConnectionTimeoutError --only-rerun ClientResponseError"
#log_cli = true
#log_cli_level = "DEBUG"
log_date_format = "%Y-%m-%dT%H:%M:%S"
log_format = "%(asctime)-15s.%(msecs)03d [%(name)-35s] %(levelname)-8s: %(message)s"
log_level = "DEBUG"
markers = [
    "remote: Tests accessing the internet.",
    "slow: Slow tests.",
    "sql: All tests related to SQL.",
    "explorer: All tests related to the explorer UI.",
    "cflake: Tests which are flaky under concurrency",
]
minversion = "2.0"
testpaths = ["tests"]
# Detect tests marked with xfail, which are actually succeeding.
# xfail_strict = true

# Retry flaky tests, thereby improving the consistency of the test suite results.
# --only-rerun flags in addopts restrict retries to transient network errors.
reruns = 2
reruns_delay = 5

[tool.coverage.run]
branch = true
source = ["src/wetterdienst"]
[tool.coverage.report]
show_missing = true
fail_under = 0
omit = [
    "tests/*",
    "src/wetterdienst/provider/dwd/radar/cli.py",
]

[tool.uv.audit]
# diskcache uses pickle for serialization (CVE-2025-69872 / GHSA-w8v5-vhqr-4h9v).
# The threat requires write access to the local user cache directory, which is not
# a realistic attack vector for this project.
ignore-until-fixed = ["GHSA-w8v5-vhqr-4h9v"]
